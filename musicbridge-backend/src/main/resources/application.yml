spring:
  application:
    name: musicbridge-backend
  profiles:
    # 本机与远程使用同一套配置项，仅通过环境变量区分
    active: ${MB_PROFILE:local}
  datasource:
    # 连接信息只从环境变量读取，仓库内仅保留占位符；本地密钥不得提交
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/musicbridge?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:musicbridge}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  # 仅监听本机回环地址，禁止绑定任意网卡
  address: 127.0.0.1
  # 默认端口与桌面端 API Base URL 保持一致，可用环境变量覆盖
  port: ${MB_SERVER_PORT:18080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # traceId 由 TraceFilter 写入 MDC，日志与调用日志共用同一链路标识
    level: "%5p [trace=%X{traceId:-none}]"

musicbridge:
  cache:
    # 缓存 TTL 矩阵（外置配置，未配置项回落到 CacheCategory 默认值）
    max-retention: 200d
    ttl:
      metadata: 7d
      cover: 30d
      lyrics-plain: 30d
      lyrics-synced: 90d
      translation: 90d
      transliteration: 180d
      recognition: 24h
      search: 1h
      negative: 20m
  security:
    # 单机最小认证：账号密码只走环境变量，密码为空时登录不可用
    local-user-id: ${MUSICBRIDGE_LOCAL_USER_ID:local-user}
    local-username: ${MUSICBRIDGE_LOCAL_USERNAME:local}
    local-password: ${MUSICBRIDGE_LOCAL_PASSWORD:}
    session-ttl: ${MUSICBRIDGE_SESSION_TTL:7d}
    cors:
      # 默认拒绝所有跨源；开发环境在 application-local.yml 中显式列出
      allowed-origins: ${MUSICBRIDGE_CORS_ALLOWED_ORIGINS:}
  providers:
    # 主动探测默认关闭，仅白名单 Provider 可在管理端按需触发
    probe-enabled: false
    probe-whitelist: []
    policy:
      max-external-calls-per-task: 5
      max-switches-per-task: 2
      retry-base-ms: 200
      max-retries: 3
      circuit-failure-threshold: 3
      circuit-open-ms: 60000
      half-open-permits: 1
      retry-after-switch-threshold-ms: 10000
      default-retry-after-ms: 60000
      capability-cooldown-ms: 86400000
      quota-cooldown-ms: 3600000
    entries:
      mock-recognition:
        priority: 30
        requests-per-second: 100
        burst-capacity: 100
        cost-per-unit: 0
      mock-metadata:
        priority: 30
        requests-per-second: 100
        burst-capacity: 100
        cost-per-unit: 0
      mock-lyrics:
        priority: 30
        requests-per-second: 100
        burst-capacity: 100
        cost-per-unit: 0
      mock-translation:
        priority: 30
        requests-per-second: 100
        burst-capacity: 100
        cost-per-unit: 0
      mock-transliteration:
        priority: 30
        requests-per-second: 100
        burst-capacity: 100
        cost-per-unit: 0
      audd:
        enabled: false
        priority: 100
        timeout-ms: 30000
        requests-per-second: 5
        burst-capacity: 5
        cost-per-unit: 0.005
        api-key: ${AUDD_API_KEY:}
      acoustid:
        enabled: false
        priority: 50
        requests-per-second: 3
        burst-capacity: 3
        cost-per-unit: 0
        api-key: ${ACOUSTID_API_KEY:}
      acrcloud:
        enabled: false
        priority: 90
        requests-per-second: 5
        burst-capacity: 5
        cost-per-unit: 0
        api-key: ${ACRCLOUD_ACCESS_KEY:}
        base-url: ${ACRCLOUD_HOST:}
      musicbrainz:
        enabled: false
        priority: 100
        requests-per-second: 1
        burst-capacity: 1
        cost-per-unit: 0
        api-key: ""
        base-url: ${MUSICBRAINZ_BASE_URL:https://musicbrainz.org/ws/2}
      itunes:
        enabled: false
        priority: 200
        requests-per-second: 0.3
        burst-capacity: 1
        cost-per-unit: 0
      lrclib:
        enabled: false
        priority: 100
        requests-per-second: 0.4
        burst-capacity: 1
        cost-per-unit: 0
        base-url: ${LRCLIB_BASE_URL:https://lrclib.net/api}
      argos:
        enabled: false
        priority: 100
        requests-per-second: 5
        burst-capacity: 5
        cost-per-unit: 0
        base-url: ${ARGOS_BASE_URL:}
      pypinyin:
        enabled: false
        priority: 100
        requests-per-second: 10
        burst-capacity: 10
        cost-per-unit: 0
